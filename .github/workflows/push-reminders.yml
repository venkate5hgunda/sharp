name: Push reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sharp-push-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deliver eligible daily reminders
        env:
          SHARP_PUSH_URL: https://sharp-push.cheeryowl513.chatgpt.site/internal/tick
        run: node scripts/run-push-tick.mjs
