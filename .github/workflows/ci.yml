name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*'); do
            node --check "$f" || exit 1
          done
          echo "All JS files pass syntax check"
      - name: Run unit tests
        run: npm test
