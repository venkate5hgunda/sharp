name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check tracked JavaScript and evaluation-script syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - name: Verify pinned optional runtime build
        run: npm run build:inference && git diff --exit-code -- assets/optional-runtime
      - run: npm test
      - run: npm run eval:regression
      - run: npm run check:offline

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit-mobile
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser and accessibility tests
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.project }}
          path: test-results/
          retention-days: 14

  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Cache checksum-verified CPU artifacts
        uses: actions/cache@v4
        with:
          path: .cache/sharp-evals/cpu
          key: cpu-model-${{ runner.os }}-${{ hashFiles('scripts/cpu-profile.mjs') }}
      - name: Run all real model cases on the CPU runner
        run: npm run eval:cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            .cache/sharp-evals/latest-cpu-report.json
            .cache/sharp-evals/latest-failed-run.json

  # Preserve the existing required-check name. Skipped/cancelled dependencies cannot pass.
  test:
    if: always()
    needs: [checks, browsers, inference]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required CI jobs did not succeed: ' + ', '.join(failed))
          print('Unit, policy, both browser projects, and real CPU inference passed.')
          PY
