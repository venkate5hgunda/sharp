name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify pinned optional runtime build
        run: npm run build:inference && git diff --exit-code -- assets/optional-runtime
      - name: Check JS syntax
        run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*'); do
            node --check "$f" || exit 1
          done
          echo "All JS files pass syntax check"
      - name: Run unit tests
        run: npm test
      - name: Check portable regressions and enforce inference release policy
        run: npm run eval:regression
      - name: Cache pinned CPU evaluation artifacts
        uses: actions/cache@v4
        with:
          path: .cache/sharp-evals/cpu
          key: cpu-model-${{ runner.os }}-${{ hashFiles('scripts/cpu-profile.mjs') }}
      - name: Run real model evaluations (CPU when GPU is unavailable)
        run: npm run eval:full
      - name: Verify offline manifest
        run: npm run check:offline
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser and accessibility tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation-reports
          if-no-files-found: ignore
          path: |
            .cache/sharp-evals/latest-cpu-report.json
            .cache/sharp-evals/latest-model-report.json
            .cache/sharp-evals/latest-capability-report.json
            .cache/sharp-evals/latest-failed-run.json
