<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="facetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="facetB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background subtle halo -->
  <circle cx="60" cy="60" r="54" fill="url(#logoGrad)" fill-opacity="0.08"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Geometric prism -->
  <polygon points="60,12 104,44 88,102 32,102 16,44" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Facets radiating from focal point -->
  <polygon points="60,12 60,60 16,44" fill="url(#facetA)"/>
  <polygon points="60,12 104,44 60,60" fill="url(#facetB)"/>
  <polygon points="104,44 88,102 60,60" fill="#6366f1" fill-opacity="0.5"/>
  <polygon points="88,102 32,102 60,60" fill="#a855f7" fill-opacity="0.4"/>
  <polygon points="32,102 16,44 60,60" fill="#06b6d4" fill-opacity="0.45"/>

  <!-- Crisp internal refraction lines -->
  <line x1="60" y1="12" x2="60" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="44" x2="60" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="44" x2="60" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="88" y1="102" x2="60" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="102" x2="60" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Neural spark center -->
  <circle cx="60" cy="60" r="6" fill="#ffffff" filter="url(#logoGlow)"/>
  <circle cx="60" cy="60" r="3" fill="#6366f1"/>
</svg>
