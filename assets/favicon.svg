<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sharpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Sharp faceted neural diamond -->
  <polygon points="32,4 58,22 48,56 16,56 6,22" fill="#0f172a" stroke="url(#sharpGrad)" stroke-width="3" filter="url(#glow)"/>
  <polygon points="32,4 32,32 6,22" fill="#38bdf8" fill-opacity="0.25"/>
  <polygon points="32,4 58,22 32,32" fill="#6366f1" fill-opacity="0.4"/>
  <polygon points="58,22 48,56 32,32" fill="#a855f7" fill-opacity="0.3"/>
  <polygon points="16,56 6,22 32,32" fill="#38bdf8" fill-opacity="0.15"/>
  <polygon points="16,56 48,56 32,32" fill="#6366f1" fill-opacity="0.5"/>
  <!-- Central energy spark -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
  <line x1="32" y1="4" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="58" y1="22" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="6" y1="22" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="48" y1="56" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="16" y1="56" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>
